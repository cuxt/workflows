# Agents-Anywhere（anywhere-labs/Agents-Anywhere）自动打包
#
# 上游只发客户端产物（.apk / .dmg / .exe）和源码，**不发镜像**：它的 compose 是
# `build: {context: ..}`，Quickstart 也是让你本地 `docker build`。所以这里每 6 小时
# 看一眼有没有新的 GitHub Release，有就按那个 release 的 tag 构建并推到 GHCR。
#
# 几个关键取舍（改之前先读）：
#   · 触发依据是**上游 Release 的 tag**，不是分支 HEAD —— 跟着发版走，产物可追溯；
#   · 构建上下文是**整个上游仓库**（docker/Dockerfile 要 COPY web-next/ 与 server/），
#     所以按 tag 下源码 tarball 解到 src/ 再构建；
#   · **amd64 与 arm64 各用原生 runner 构建**，不用 QEMU：
#       amd64 → ubuntu-latest，arm64 → ubuntu-24.04-arm
#     理由：构建里的 Next.js（yarn build）在 QEMU 下会慢到不可用，而运行时镜像只有
#     Python + 静态前端，原生 arm64 层在 arm 服务器上跑起来没有任何翻译损耗。
#     两个架构并行构建，各自推 `:<内容寻址>-<arch>` 中间标签，最后由 merge job 用
#     `imagetools create` 合成多架构 manifest，所以 `docker pull` 会自动选对本机架构。
#
# 触发：
#   · schedule           每 6 小时看一次有没有新 release（有新的才构建）
#   · workflow_dispatch  手动：可 force 强制重建，也可指定某个 release tag 重建
#   · push               本文件变化时（首次推上来会立刻构建一份，省得等定时）
#
# 许可：上游是 Apache-2.0（仓库根有 LICENSE）。镜像里是上游源码编译出来的产物，
# 再分发时遵守 Apache-2.0（保留版权与许可声明），标签里也记了 upstream.license。

name: agents-anywhere

on:
  schedule:
    # 每 6 小时一次（UTC）。cron 用非整点分钟，避开整点的排队高峰。
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略「已是最新」判断，强制重新构建推送'
        type: boolean
        default: false
      tag:
        description: '指定上游 release tag（留空 = 最新的正式 release）'
        type: string
        required: false
        default: ''
  push:
    # 只认本文件的变化：之后改 README 不会白白跑一次构建。
    paths:
      - '.github/workflows/agents-anywhere.yml'

# 两次运行不互相打断（排队，不取消）：否则并发构建同一批标签时 latest 指向谁不好说。
concurrency:
  group: agents-anywhere
  cancel-in-progress: false

permissions:
  contents: read
  # 推镜像到 GHCR 必须显式声明；只有 contents 会被拒。
  packages: write

env:
  UPSTREAM_REPO: anywhere-labs/Agents-Anywhere
  UPSTREAM_DOCKERFILE: docker/Dockerfile

jobs:
  # ── 1. 解析目标：查 release、判断要不要建、算出最终标签 ───────────────────
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # push 触发时只在默认分支上真跑，避免 feature 分支把 latest 覆盖掉。
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    outputs:
      image: ${{ steps.image.outputs.ghcr }}
      tag: ${{ steps.rel.outputs.tag }}
      sha: ${{ steps.rel.outputs.sha }}
      html: ${{ steps.rel.outputs.html }}
      is_latest: ${{ steps.rel.outputs.is_latest }}
      probe: ${{ steps.check.outputs.probe_tag }}
      need_build: ${{ steps.check.outputs.need_build }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: 解析镜像名
        id: image
        env:
          # 仓库所有者自动带上（谁 fork 就推谁名下）；想改名就设仓库 Variable。
          IMAGE_NAME: ${{ vars.AGENTS_ANYWHERE_IMAGE_NAME || 'agents-anywhere' }}
        run: |
          set -euo pipefail
          # GHCR 要求镜像名全小写，用户名可能含大写字母，所以强制转小写。
          GHCR="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME,,}"
          echo "ghcr=${GHCR}" >> "$GITHUB_OUTPUT"
          echo "镜像名：${GHCR}"

      - name: 解析目标 Release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${UPSTREAM_REPO}"

          # 优先带 token 请求（额度高）；token 对别的仓库不适用时退回匿名。
          fetch() {
            local url="$1"
            if [ -n "${GH_TOKEN:-}" ]; then
              curl -fsSL -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" "$url" && return 0
            fi
            curl -fsSL -H "Accept: application/vnd.github+json" "$url"
          }

          if [ -n "${WANT:-}" ]; then
            echo "手动指定 release tag：${WANT}"
            REL="$(fetch "${API}/releases/tags/${WANT}")" \
              || { echo "::error::找不到 release ${WANT}"; exit 1; }
          else
            # /releases/latest 只返回**最新的正式 release**（不含 draft 与 prerelease），正合需求。
            REL="$(fetch "${API}/releases/latest")" \
              || { echo "::error::拉取最新 release 失败（上游还没发过 release？）"; exit 1; }
          fi

          TAG="$(printf '%s' "$REL" | jq -r '.tag_name // empty')"
          [ -n "$TAG" ] || { echo "::error::release 里没有 tag_name"; exit 1; }
          PUBLISHED="$(printf '%s' "$REL" | jq -r '.published_at // empty')"
          HTML="$(printf '%s' "$REL" | jq -r '.html_url // empty')"

          # 解析这个 tag 指向的提交：tarball 与标签都按它取，避免 release 被改过之后对不上。
          COMMIT="$(fetch "${API}/commits/${TAG}" | jq -r '.sha // empty')"
          [ -n "$COMMIT" ] || { echo "::error::解析 ${TAG} 的提交失败"; exit 1; }

          # 是不是最新的那份 release —— 决定要不要动 `latest` 标签。
          LATEST_TAG="$(fetch "${API}/releases/latest" | jq -r '.tag_name // empty')"
          if [ -n "$LATEST_TAG" ] && [ "$TAG" = "$LATEST_TAG" ]; then
            IS_LATEST=1
          else
            IS_LATEST=0
          fi

          {
            echo "tag=${TAG}"
            echo "sha=${COMMIT}"
            echo "published=${PUBLISHED}"
            echo "is_latest=${IS_LATEST}"
            echo "html=${HTML}"
          } >> "$GITHUB_OUTPUT"

          echo "目标 release：${TAG}（发布 ${PUBLISHED:-未知}）"
          echo "对应提交：${COMMIT}"
          echo "是否 latest：${IS_LATEST}"
          echo "release 页面：${HTML}"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 判断是否需要构建
        id: check
        env:
          IMAGE: ${{ steps.image.outputs.ghcr }}
          SHA: ${{ steps.rel.outputs.sha }}
          TAG: ${{ steps.rel.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # 用「release 提交的内容寻址标签」作为已构建依据：
          # 同一个 tag 被移动过（重新发布）时也能认出来，而只看 release tag 会误判成已构建。
          PROBE="sha-${SHA:0:12}"
          echo "probe_tag=${PROBE}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE}" = "true" ]; then
            echo "手动要求强制重建"
            echo "need_build=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 三个标签都在才算「已构建」：合成后的多架构 manifest，以及两个架构的中间产物。
          # 少了中间产物说明是旧的单架构流水线打的（或者某个架构上次失败了），要重建。
          MISSING=0
          for t in "${IMAGE}:${PROBE}" "${IMAGE}:${PROBE}-amd64" "${IMAGE}:${PROBE}-arm64"; do
            if docker buildx imagetools inspect "$t" >/dev/null 2>&1; then
              echo "已存在：$t"
            else
              echo "缺失：$t"
              MISSING=1
            fi
          done

          if [ "$MISSING" = "0" ]; then
            echo "上游 release 未变化（${TAG} → ${PROBE} 已完整构建），跳过"
            echo "need_build=0" >> "$GITHUB_OUTPUT"
          else
            echo "检测到需要构建（${TAG} → ${PROBE}）"
            echo "need_build=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 解析标签
        if: steps.check.outputs.need_build == '1'
        id: tags
        env:
          GHCR: ${{ steps.image.outputs.ghcr }}
          TAG: ${{ steps.rel.outputs.tag }}
          PROBE: ${{ steps.check.outputs.probe_tag }}
          IS_LATEST: ${{ steps.rel.outputs.is_latest }}
        run: |
          set -euo pipefail
          # 只给**最新**那份 release 动 latest，免得手动重建老版本时把 latest 指回去。
          TAGS="$(printf '%s\n' "${GHCR}:${TAG}" "${GHCR}:${PROBE}")"
          if [ "${IS_LATEST}" = "1" ]; then
            TAGS="$(printf '%s\n' "${GHCR}:latest")"$'\n'"${TAGS}"
          fi
          {
            echo "tags<<__TAGS__"
            printf '%s\n' "$TAGS"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"
          echo "合并且将推送："
          printf '%s\n' "$TAGS" | sed 's/^/  /'

      - name: 无变化时的小结
        if: steps.check.outputs.need_build != '1'
        run: |
          {
            echo "## 上游没有新 release，已跳过构建"
            echo ""
            echo "当前镜像已对应 release \`${{ steps.rel.outputs.tag }}\`"
            echo "（提交 \`${{ steps.rel.outputs.sha }}\`，探测标签 \`${{ steps.check.outputs.probe_tag }}\`）。"
            echo ""
            echo "想强制重建：Actions → agents-anywhere → Run workflow，勾上 force；"
            echo "想重建某个历史版本：同一个入口，在 tag 里填例如 \`v2.0.0\`。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. 两个架构并行构建，各自推中间标签 ─────────────────────────────────
  build:
    needs: prepare
    if: needs.prepare.outputs.need_build == '1'
    timeout-minutes: 90
    strategy:
      # 一个架构失败不要掐掉另一个：两边都建完，下一次 force 重建能省一半时间。
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # GitHub 的 arm64 托管 runner；换自建 runner 就设仓库 Variable。
            runner: ${{ vars.AGENTS_ANYWHERE_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载该 release 的源码
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # 按 tag 取源码 tarball（codeload 不需要 token）。构建上下文必须是**仓库根**，
          # 因为 docker/Dockerfile 里 COPY 的是 web-next/ 与 server/。
          URL="https://codeload.github.com/${UPSTREAM_REPO}/tar.gz/refs/tags/${TAG}"
          curl -fsSL --retry 3 --retry-delay 5 -o upstream-src.tgz "$URL"

          mkdir -p src
          tar -xzf upstream-src.tgz -C src --strip-components=1
          rm -f upstream-src.tgz

          # 上游改动 Dockerfile 的输入路径时在这里就明确失败，别等到两层构建跑完才报错。
          for f in "${UPSTREAM_DOCKERFILE}" web-next/package.json web-next/.yarnrc.yml server/pyproject.toml; do
            [ -f "src/${f}" ] \
              || { echo "::error::${TAG} 的源码里没有 ${f}，无法构建"; exit 1; }
          done
          echo "源码大小：$(du -sh src | cut -f1)"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送（linux/${{ matrix.arch }}）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./src
          # 上游自带的 Dockerfile：多阶段（node 里 yarn build → python 里 uv sync），
          # tini 当 PID 1，监听 8000，数据目录 /data。
          # 显式指定 target：万一上游以后在 server 之后又加阶段，默认 target 会打错产物，
          # 而这里会直接失败。
          file: ./src/docker/Dockerfile
          target: server
          # 每个 job 只建自己那一架构，用的是原生 CPU，没有 QEMU。
          platforms: linux/${{ matrix.arch }}
          push: true
          # 每次都重新拉基础镜像：node / python 的 slim 层更新后能自动跟上，不用等下次改代码。
          pull: true
          labels: |
            org.opencontainers.image.title=agents-anywhere
            org.opencontainers.image.description=Agents-Anywhere 服务端（上游源码构建，非官方镜像）
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.url=${{ needs.prepare.outputs.html }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0
            org.agents-anywhere.upstream.repo=${{ env.UPSTREAM_REPO }}
            org.agents-anywhere.upstream.release=${{ needs.prepare.outputs.tag }}
            org.agents-anywhere.upstream.commit=${{ needs.prepare.outputs.sha }}
            org.agents-anywhere.arch=${{ matrix.arch }}
            org.agents-anywhere.built-by=github.com/${{ github.repository }}
          # 中间标签：按架构分开，给 merge job 合成用。也方便单独调试某一架构。
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.probe }}-${{ matrix.arch }}
          # 关掉证明：它会在 manifest 里塞进 attestation 条目，个别旧版 Docker 拉取时报
          # unknown/unknown platform。要溯源就跑 `docker buildx imagetools inspect`。
          provenance: false
          sbom: false
          # 复用上一次的层缓存（yarn / uv 那几层没变就不用重装）。两个架构各用一个 scope。
          cache-from: type=gha,scope=agents-anywhere-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agents-anywhere-${{ matrix.arch }}

  # ── 3. 把两个架构合成多架构 manifest ────────────────────────────────────
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并多架构清单
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          PROBE: ${{ needs.prepare.outputs.probe }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          SRC_AMD="${IMAGE}:${PROBE}-amd64"
          SRC_ARM="${IMAGE}:${PROBE}-arm64"

          # 先把两个源 manifest 都确认在，再动最终标签：避免只合并了一半就把 latest 改掉。
          for t in "$SRC_AMD" "$SRC_ARM"; do
            docker buildx imagetools inspect "$t" >/dev/null \
              || { echo "::error::缺少 ${t}，不合并"; exit 1; }
          done

          # 所有最终标签一次推上去：它们指向同一个 index digest，不会出现「latest 换了、
          # vX.Y.Z 没换」的中间态。
          ARGS=()
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            ARGS+=("-t" "$t")
          done <<< "$TAGS"
          [ "${#ARGS[@]}" -gt 0 ] || { echo "::error::没有要合成的标签"; exit 1; }

          printf '合成到：%s\n' "${ARGS[*]}"
          docker buildx imagetools create "${ARGS[@]}" "$SRC_AMD" "$SRC_ARM"

          echo "--- 结果 ---"
          docker buildx imagetools inspect "${IMAGE}:${PROBE}"

      - name: 输出结果
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PROBE: ${{ needs.prepare.outputs.probe }}
          IS_LATEST: ${{ needs.prepare.outputs.is_latest }}
          HTML: ${{ needs.prepare.outputs.html }}
          PLATFORMS: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.probe }}
        run: |
          {
            echo "## Agents-Anywhere 镜像已推送"
            echo ""
            echo "拉取（可直接复制）："
            echo ""
            echo '```bash'
            echo "docker pull ${IMAGE}:${TAG}"
            if [ "${IS_LATEST}" = "1" ]; then
              echo "docker pull ${IMAGE}:latest"
            fi
            echo '```'
            echo ""
            echo "标签："
            echo ""
            echo '```'
            if [ "${IS_LATEST}" = "1" ]; then
              echo "${IMAGE}:latest          # 最新一份 release"
            fi
            echo "${IMAGE}:${TAG}          # 对应上游 release"
            echo "${IMAGE}:${PROBE}    # 内容寻址（release 的提交前 12 位）"
            echo '```'
            echo ""
            echo "平台：linux/amd64 + linux/arm64（各自原生构建，无 QEMU；\`docker pull\` 自动选架构）"
            echo ""
            echo "按架构的中间标签（调试用，一般不直接用）："
            echo ""
            echo '```'
            echo "${IMAGE}:${PROBE}-amd64"
            echo "${IMAGE}:${PROBE}-arm64"
            echo '```'
            echo ""
            echo "上游 release：${HTML}"
            echo ""
            echo "> 这是**非官方镜像**，由上游 Apache-2.0 源码构建；运行方式见仓库 \`deploy/agents-anywhere/\`。"
          } >> "$GITHUB_STEP_SUMMARY"
